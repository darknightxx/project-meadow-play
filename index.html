		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #172b26;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

window.MEADOW_PCK_WASM = true;
// tools/deploy/webbuild.py: index.wasm ships gzipped as index.gz.wasm and is inflated here (DecompressionStream).
(function () {
  const realFetch = window.fetch.bind(window);
  window.fetch = async function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || String(input);
    if (/(^|\/)index\.wasm(\?|#|$)/.test(url)) {
      const r = await realFetch(url.replace('index.wasm', 'index.gz.wasm'), init);
      if (!r.ok) return r;
      let buf = new Uint8Array(await r.arrayBuffer());
      if (buf[0] === 0x1f && buf[1] === 0x8b) {   // still gzipped (the server did not add Content-Encoding)
        const ds = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
        buf = new Uint8Array(await new Response(ds).arrayBuffer());
      }
      return new Response(buf, { status: 200, headers: { 'Content-Type': 'application/wasm',
                                                         'Content-Length': String(buf.byteLength) } });
    }
    if (window.MEADOW_PCK_WASM) {                // --artifact-layout: packs are served as *.pck.wasm
      const pm = url.match(/^(.*\.pck)(\?.*|#.*)?$/);
      if (pm) return realFetch(pm[1] + '.wasm' + (pm[2] || ''), init);
    }
    return realFetch(input, init);
  };
})();

		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
		<!-- extra-packs-hook -->
		<script>
// Extra resource packs (tools/web/README.md). Runs right after Godot's own start-up script: `engine.startGame()`
// is already downloading the wasm + main pack; the extra packs download in parallel and are copied into the
// in-memory file system before the engine starts (engine.start is wrapped on the instance - Godot builds a
// fresh prototype per Engine instance, so Engine.prototype cannot be patched). scripts/client/pack_loader.gd mounts
// them on first use (NatureKit.ensure_pack / CharModel.config / Audio.play_voice / game.gd map load / CardArt).
(function () {
	if (typeof engine === 'undefined' || typeof engine.start !== 'function') {
		return;
	}
	const EXTRA = [['index.nature.pck', '/tmp/index.nature.pck'], ['index.characters.pck', '/tmp/index.characters.pck'],
		['index.voice.pck', '/tmp/index.voice.pck'], ['index.monsters3d.pck', '/tmp/index.monsters3d.pck']];
	EXTRA.push(['index.sfx.pck', '/tmp/index.sfx.pck']);   // SKILLSFX: skill / special / monster sounds (SkillSfx)
	// PCKSLIM: map ground / decor / field music (game.gd before a map loads, Audio) + card portraits (CardArt)
	EXTRA.push(['index.world.pck', '/tmp/index.world.pck'], ['index.cards.pck', '/tmp/index.cards.pck']);
	EXTRA.push(['index.monsters2d.pck', '/tmp/index.monsters2d.pck']);   // PCKSLIM: 2D monster sheets (SpriteSet)
	const extra = Promise.all(EXTRA.map(function (e) {
		return engine.preloadFile(e[0], e[1]).catch(function (err) {
			console.warn('extra pack not loaded: ' + e[0], err);
		});
	}));
	const origStart = engine.start;
	engine.start = function () {
		const args = arguments;
		return extra.then(function () {
			return origStart.apply(engine, args);
		});
	};
}());
		</script>
