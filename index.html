		<title>Project Meadow</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #172b26;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

window.MEADOW_PCK_WASM = true;
// tools/deploy/webbuild.py: index.wasm ships gzipped as index.gz.wasm and is inflated here (DecompressionStream).
(function () {
  const realFetch = window.fetch.bind(window);
  window.fetch = async function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || String(input);
    if (/(^|\/)index\.wasm(\?|#|$)/.test(url)) {
      const r = await realFetch(url.replace('index.wasm', 'index.gz.wasm'), init);

      if (buf[0] === 0x1f && buf[1] === 0x8b) {   // still gzipped (the server did not add Content-Encoding)
        const ds = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
        buf = new Uint8Array(await new Response(ds).arrayBuffer());

      return new Response(buf, { status: 200, headers: { 'Content-Type': 'application/wasm',
                                                         'Content-Length': String(buf.byteLength) } });
    }
    if (window.MEADOW_PCK_WASM) {                // --artifact-layout: packs are served as *.pck.wasm
