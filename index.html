		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>
// Boot diagnostics for the web shell (injected by tools/deploy/webbuild.py before the wasm shim and index.js).
// Shows WHERE start-up stops on devices without a console (iOS Safari): the current stage, download progress, the
// wasm heap size, JS errors / Godot console errors and WebGL context loss. The panel appears when ?debug=1 is in
// the URL, when start-up looks stuck (no download progress for 25 s, or not running after 90 s), when an error happens during start-up, or when the previous attempt
// died (iOS kills tabs that use too much memory and reloads them - the last stage + heap size are kept in
// localStorage "meadow.boot", so the reload can say what happened).
(function () {
  'use strict';
  var KEY = 'meadow.boot';
  var t0 = Date.now();
  var q = String(location.search || '');
  var forced = /[?&]debug=1(&|$)/.test(q);
  var state = { stage: 'html', t: t0, mem: 0, peak: 0, err: '', ua: navigator.userAgent, url: location.pathname };
  var lines = [];
  var prev = null;
  var mems = [];          // WebAssembly.Memory objects seen
  var shown = false, panel = null, body = null, started = false, bootErr = false;
  var lastProg = -1, lastProgT = Date.now();

  try { prev = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { prev = null; }

  function mb(n) { return Math.round(n / 1048576); }
  function heap() {
    var m = 0;
    for (var i = 0; i < mems.length; i++) { try { m = Math.max(m, mems[i].buffer.byteLength); } catch (e) {} }
    return m;
  }
  function save(extra) {
    state.t = Date.now();
    state.mem = heap();
    state.peak = Math.max(state.peak, state.mem);
    if (extra) { for (var k in extra) { state[k] = extra[k]; } }
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function log(msg) {
    var s = ((Date.now() - t0) / 1000).toFixed(1) + 's ' + String(msg).slice(0, 220);
    lines.push(s);
    if (lines.length > 40) { lines.shift(); }
    render();
  }
  function stage(name, note) {
    state.stage = name;
    save();
    log('▶ ' + name + (note ? ' — ' + note : ''));
  }
  function error(msg) {
    msg = String(msg).slice(0, 300);
    state.err = msg;
    save();
    log('✖ ' + msg);
    if (!started) { bootErr = true; show(); }
  }

  // ---- panel ----
  function show() {
    if (shown) { return; }
    shown = true;
    var make = function () {
      if (panel || !document.body) { return; }
      panel = document.createElement('div');
      panel.id = 'meadow-boot-diag';
      panel.setAttribute('style', 'position:fixed;left:6px;top:6px;right:6px;max-height:55%;overflow:auto;z-index:2147483647;' +
        'background:rgba(0,0,0,.82);color:#e8f5d0;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;padding:6px 8px;' +
        'border:1px solid #7a9a4a;border-radius:6px;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text');
      var bar = document.createElement('div');
      bar.setAttribute('style', 'display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;color:#ffd77a');
      bar.textContent = 'ตรวจการโหลดเกม (แคปหน้าจอนี้ส่งให้ทีมงาน)';
      var x = document.createElement('button');
      x.textContent = '✕';
      x.setAttribute('style', 'background:#5b3943;color:#fff;border:0;border-radius:4px;padding:2px 8px;font-size:13px');
      x.onclick = function () { panel.style.display = 'none'; };
      bar.appendChild(x);
      body = document.createElement('div');
      panel.appendChild(bar);
      panel.appendChild(body);
      document.body.appendChild(panel);
      render();
    };
    if (document.body) { make(); } else { document.addEventListener('DOMContentLoaded', make); }
  }
  function render() {
    if (!body) { return; }
    var p = document.getElementById('status-progress');
    var prog = '';
    if (p && p.max > 0 && p.value >= 0) { prog = ' · ดาวน์โหลด ' + Math.round(100 * p.value / p.max) + '% (' + mb(p.value) + '/' + mb(p.max) + ' MB)'; }
    var head = 'ขั้น: ' + state.stage + ' · ' + ((Date.now() - t0) / 1000).toFixed(0) + ' วิ' + prog +
      '\nหน่วยความจำเกม (wasm): ' + mb(heap()) + ' MB (สูงสุด ' + mb(state.peak) + ' MB)' +
      (performance && performance.memory ? ' · JS ' + mb(performance.memory.usedJSHeapSize) + ' MB' : '') +
      '\n' + navigator.userAgent.replace(/^Mozilla\/5\.0 /, '') + ' · จอ ' + innerWidth + 'x' + innerHeight + ' @' + (window.devicePixelRatio || 1) +
      '\nDecompressionStream: ' + (typeof DecompressionStream) + ' · WebGL2: ' + gl2();
    var prevNote = '';
    if (prevBad) {
      prevNote = '\n⚠ ครั้งก่อนหยุดที่ขั้น "' + prev.stage + '" หลังเริ่ม ' + Math.round((prev.t - (prev.t0 || prev.t)) / 1000) +
        ' วิ · wasm ' + mb(prev.mem || 0) + ' MB (สูงสุด ' + mb(prev.peak || 0) + ' MB)' + (prev.err ? ' · ' + prev.err : '') +
        '\n  (iOS ปิดแท็บที่ใช้หน่วยความจำมากแล้วโหลดใหม่ให้เอง)';
    }
    body.textContent = head + prevNote + '\n—\n' + lines.join('\n');
  }
  var gl2cache = null;
  function gl2() {
    if (gl2cache !== null) { return gl2cache; }
    try {
      var c = document.createElement('canvas');
      var g = c.getContext('webgl2');
      if (!g) { gl2cache = 'ไม่มี'; return gl2cache; }
      var mt = g.getParameter(g.MAX_TEXTURE_SIZE);
      var ext = g.getExtension('WEBGL_lose_context');
      gl2cache = 'มี (max tex ' + mt + ')';
      if (ext) { ext.loseContext(); }

    return gl2cache;
  }

  var prevBad = !!(prev && prev.stage && prev.stage !== 'closed' && (Date.now() - (prev.t || 0)) < 10 * 60 * 1000 &&

  save();
  if (prevBad || forced) { show(); }
  if (prevBad) { log('ครั้งก่อนไม่ได้ปิดตามปกติ: ขั้น ' + prev.stage); }

    var orig = console[k];
    console[k] = function () {
      try {
        var a = [];
        for (var i = 0; i < arguments.length; i++) { a.push(String(arguments[i])); }
        var s = a.join(' ');
        if (k === 'error') { log('console.error: ' + s); if (!started) { bootErr = true; show(); } } else { log('warn: ' + s); }
      } catch (e) {}
      return orig.apply(console, arguments);
    };
  });

  var realFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || String(input);
    var name = String(url).split('?')[0].split('/').pop();
    log('fetch ' + name);
    return realFetch(input, init).then(function (r) {
      log('  ' + name + ' → HTTP ' + r.status + (r.headers.get('content-length') ? ' ' + mb(+r.headers.get('content-length')) + ' MB' : '') +
          (r.headers.get('content-encoding') ? ' (' + r.headers.get('content-encoding') + ')' : ''));
      return r;
    }, function (e) { error('fetch ' + name + ' ล้มเหลว: ' + e); throw e; });
  };

  if (typeof DecompressionStream === 'function') {
    var RealDS = DecompressionStream;
    window.DecompressionStream = function (fmt) { stage('wasm-gunzip'); return new RealDS(fmt); };
    window.DecompressionStream.prototype = RealDS.prototype;

    try {

    } catch (e) {}

      var ris = W.instantiateStreaming.bind(W);
      W.instantiateStreaming = function (src, imp) {
        grabImports(imp);
        stage('wasm-compile', 'streaming');
        return ris(src, imp).then(function (res) { grabMemory(res); stage('wasm-ready', 'heap ' + mb(heap()) + ' MB'); return res; },
          function (e) { error('wasm compile (stream): ' + e); throw e; });
      };
    }
    var ri = W.instantiate.bind(W);
    W.instantiate = function (src, imp) {

      stage('wasm-compile');
      return ri(src, imp).then(function (res) { grabMemory(res); stage('wasm-ready', 'heap ' + mb(heap()) + ' MB'); return res; },
        function (e) { error('wasm compile: ' + e); throw e; });

  }

  var tries = 0;
  var poll = setInterval(function () {
    tries++;

    try { eng = (typeof engine !== 'undefined') ? engine : null; } catch (e) { eng = null; }
    if (eng && typeof eng.start === 'function' && !eng.__diag) {
      eng.__diag = true;
      var os = eng.start;
      eng.start = function () {
        stage('engine-start', 'แพ็กเสริมโหลดครบ, เริ่มเอนจิน');
        var p = os.apply(eng, arguments);
        if (p && p.then) {
          p.then(function () { started = true; stage('running', 'เข้าเกมแล้ว heap ' + mb(heap()) + ' MB'); if (!forced && !bootErr && !prevBad) { hideSoon(); } },
                 function (e) { error('engine.start: ' + (e && e.message || e)); });
        }
        return p;
      };
      stage('download', 'กำลังดาวน์โหลดไฟล์เกม');
    }

  }, 20);

  function hideSoon() { setTimeout(function () { if (panel && !forced) { panel.style.display = 'none'; } }, 4000); }

    }

  }, 1000);
}());
