<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meadowfall</title>
<!-- OAUTH: the redirect page of Google / Facebook sign-in (served at /oauth/google and /oauth/facebook: the Caddyfile
     rewrites those paths to this file). It keeps the provider's answer for the game (localStorage meadow.oauth.result:
     {p, code, state, error}) and goes back to the page the player left; the game checks the state and sends the code
     to its server. Nothing is sent anywhere from here. -->
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6efd9;
color:#3c2a12;font-family:Loma,Tahoma,sans-serif;font-size:18px}</style></head>
<body><div>กำลังกลับเข้าเกม…</div>
<script>
(function () {
  var back = '/';
  try {
    var q = new URLSearchParams(location.search);
    var p = location.pathname.split('/').filter(Boolean).pop() || '';
    var r = {p: p, code: q.get('code') || '', state: q.get('state') || '',
      error: q.get('error') || q.get('error_reason') || ''};
    localStorage.setItem('meadow.oauth.result', JSON.stringify(r));
    var pend = JSON.parse(localStorage.getItem('meadow.oauth.pending') || '{}');
    if (typeof pend.ret === 'string' && pend.ret.charAt(0) === '/' && pend.ret.charAt(1) !== '/') back = pend.ret;
  } catch (e) {}
  location.replace(back);
})();
</script></body></html>
